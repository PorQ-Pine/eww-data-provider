[package]
name = "eink-window-settings"
version = "0.1.0"
edition = "2024"

[dependencies]
# Egui
eframe = { version ="0.34.1", features = ["default"] }
egui_extras = { version = "0.34.1", features = ["default", "image"] }
enum2egui = "0.34.1"
egui_keyboard = "0.6.0"
# Other
log = "0.4.33"
env_logger = "0.11.11"
quill-data-provider-lib = { path = "../quill-data-provider-lib" }
ron = "0.12.2"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
debug = false
strip = true
lto = "thin"
opt-level = 3
